[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisab-scrapper"
version = "0.1.0"
description = "Scraper for SISAB Saúde Produção reports."
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.scripts]
sisab-saude-producao = "scripts.sisab_saude_producao:main"
sisab-saude-procedimento = "scripts.sisab_saude_procedimento:main"
sisab-saude-condicao-avaliada = "scripts.sisab_saude_condicao_avaliada:main"
sisab-zip-csv-files = "scripts.zip_csv_files:main"

[tool.setuptools.packages.find]
include = ["scripts*"]
